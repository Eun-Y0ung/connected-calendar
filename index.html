<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="일정과 관련 링크를 한곳에서 관리하는 월간 일정 웹앱" />
    <title>이어달력</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23385a43'/%3E%3Cpath d='M18 26h28v22H18z' fill='%23fffefa'/%3E%3Cpath d='M18 31h28M25 18v12M39 18v12' stroke='%23fffefa' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='27' cy='39' r='3' fill='%23df775f'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
    <script src="calendar-data.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <h1>이어달력</h1>
        </div>
        <div class="header-actions">
          <button class="widget-link" id="manage-categories" type="button">카테고리 관리</button>
          <a class="widget-link" href="widget.html">주간 위젯</a>
          <button class="primary-button header-create" id="create-event" type="button">+ 일정 생성</button>
          <div class="month-controls" aria-label="월 이동">
            <button class="icon-button" id="prev-month" type="button" aria-label="이전 달">←</button>
            <h2 id="current-month" aria-live="polite"></h2>
            <button class="icon-button" id="next-month" type="button" aria-label="다음 달">→</button>
          </div>
        </div>
      </header>

      <section class="workspace" aria-label="월간 일정 관리">
        <section class="calendar-card card" aria-labelledby="current-month">
          <div class="weekday-row" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="월간 달력"></div>
        </section>

        <aside class="side-panel">
          <section class="card day-card" aria-labelledby="selected-date-heading">
            <div class="section-heading">
              <div>
                <p class="section-kicker">선택한 날짜</p>
                <h2 id="selected-date-heading"></h2>
              </div>
              <span id="event-count" class="count-badge"></span>
            </div>
            <div id="day-events" class="event-list" aria-live="polite"></div>
          </section>

        </aside>
      </section>

      <dialog id="event-dialog" class="form-dialog" aria-labelledby="form-heading">
          <section class="card form-card">
            <div class="section-heading">
              <div>
                <h2 id="form-heading">일정 생성</h2>
              </div>
              <button class="dialog-close" id="close-event-dialog" type="button" aria-label="닫기">×</button>
            </div>
            <form id="event-form" novalidate>
              <div class="field full-field">
                <label for="event-title">제목 <span aria-hidden="true">*</span></label>
                <input id="event-title" name="title" type="text" maxlength="60" required />
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="event-date">시작 날짜 <span aria-hidden="true">*</span></label>
                  <input id="event-date" name="date" type="date" required />
                </div>
                <div class="field">
                  <label for="event-end-date">종료 날짜</label>
                  <input id="event-end-date" name="endDate" type="date" />
                </div>
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="event-time">시간</label>
                  <input id="event-time" name="time" type="time" />
                </div>
                <div class="field">
                  <label for="event-type">카테고리</label>
                  <select id="event-type" name="type" required></select>
                </div>
              </div>
              <div class="field full-field">
                <label>관련 링크 <span class="optional">선택 · 여러 개 가능</span></label>
                <div id="event-links" class="link-fields"></div>
                <button class="add-link-button" id="add-link" type="button">+ 링크 추가</button>
              </div>
              <div class="field full-field">
                <label for="event-memo">메모 <span class="optional">선택</span></label>
                <textarea id="event-memo" name="memo" rows="3" maxlength="200"></textarea>
              </div>
              <p id="form-message" class="form-message" role="alert"></p>
              <div class="form-actions">
                <button class="primary-button" id="submit-button" type="submit">저장</button>
                <button class="secondary-button" id="cancel-edit" type="button">취소</button>
              </div>
            </form>
          </section>
      </dialog>

      <dialog id="category-dialog" class="form-dialog" aria-labelledby="category-heading">
        <section class="card form-card">
          <div class="section-heading">
            <h2 id="category-heading">카테고리 관리</h2>
            <button class="dialog-close" id="close-category-dialog" type="button" aria-label="닫기">×</button>
          </div>
          <form id="category-form">
            <div id="category-fields" class="category-fields"></div>
            <p id="category-message" class="form-message" role="alert"></p>
            <div class="form-actions">
              <button class="primary-button" type="submit">저장</button>
              <button class="secondary-button" id="cancel-categories" type="button">취소</button>
            </div>
          </form>
        </section>
      </dialog>

      <section class="card weekly-card" aria-labelledby="weekly-heading">
        <div class="section-heading weekly-heading-row">
          <div>
            <h2 id="weekly-heading">이번 주 일정</h2>
          </div>
          <p id="week-range" class="week-range"></p>
        </div>
        <div id="weekly-grid" class="weekly-grid"></div>
      </section>

      <footer>일정은 이 브라우저에만 저장됩니다.</footer>
    </main>
  </body>
</html>
