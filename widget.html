<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이어달력 주간 위젯</title>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <main class="widget-shell">
      <header class="widget-header">
        <div>
          <p class="eyebrow">THIS WEEK</p>
          <h1>이번 주 일정</h1>
        </div>
        <div class="header-side">
          <p id="week-range" class="week-range"></p>
          <a class="calendar-link" href="index.html" aria-label="전체 달력 열기">전체 달력</a>
        </div>
      </header>

      <section class="week-section" aria-label="이번 주 일별 일정">
        <div id="week-days" class="week-days"></div>
      </section>
    </main>

    <script src="widget.js"></script>
  </body>
</html>
